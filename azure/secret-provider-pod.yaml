# =============================================================================
# Long-lived CSI secret keeper (Deployment, NOT a one-shot Pod)
# =============================================================================
# Why a Deployment?
#   The Azure Key Vault CSI driver syncs secrets from KV into K8s Secret objects
#   ONLY while at least one pod is mounting the SecretProviderClass volume.
#   When the last mounting pod is deleted, the driver garbage-collects the K8s
#   Secrets too. If we ran this as a one-shot Pod and deleted it after sync,
#   all n8n-* Secrets would vanish before the n8n chart's pods started — causing
#   "secret not found" errors in workers, webhook processors, and task runners.
#
# This Deployment stays running (1 replica, tiny pause container) for the
# lifetime of the namespace, guaranteeing the CSI-synced Secrets persist.
# Never delete this. It uses ~16Mi of RAM and 10m CPU.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-secret-sync
  namespace: n8n
  labels:
    app: n8n-secret-sync
    app.kubernetes.io/component: secret-keeper
    app.kubernetes.io/part-of: n8n-enterprise
spec:
  replicas: 1
  strategy:
    type: Recreate              # Only one at a time — prevents CSI race on restart
  selector:
    matchLabels:
      app: n8n-secret-sync
  template:
    metadata:
      labels:
        app: n8n-secret-sync
        app.kubernetes.io/component: secret-keeper
        app.kubernetes.io/part-of: n8n-enterprise
    spec:
      serviceAccountName: n8n-enterprise
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534        # nobody
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-sync
          # MCR pause image — always reachable in Azure (the corporate firewall blocks docker.io)
          image: mcr.microsoft.com/oss/kubernetes/pause:3.9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: n8n-keyvault-secrets
      terminationGracePeriodSeconds: 10
