# =============================================================================
# Azure KeyVault SecretProviderClass - CSI Driver
# =============================================================================
# This mounts Azure KeyVault secrets as Kubernetes secrets automatically.
# Prerequisites:
#   - Azure Key Vault Provider for Secrets Store CSI Driver installed on AKS
#   - Workload Identity or Managed Identity configured
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: n8n-keyvault-secrets
  namespace: n8n
spec:
  provider: azure
  parameters:
    # deploy.sh renders the placeholder below with the CSI addon's managed
    # identity (Microsoft-recommended; falls back to the kubelet identity).
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<N8N_KV_IDENTITY_CLIENT_ID>"
    keyvaultName: "<AZURE_KEYVAULT_NAME>"           # e.g. kv-n8n-ducont
    tenantId: "<AZURE_TENANT_ID>"                   # Azure AD Tenant ID
    objects: |
      array:
        - |
          objectName: n8n-encryption-key
          objectType: secret
          objectAlias: encryption-key
        - |
          objectName: n8n-host
          objectType: secret
          objectAlias: host
        - |
          objectName: n8n-port
          objectType: secret
          objectAlias: port
        - |
          objectName: n8n-protocol
          objectType: secret
          objectAlias: protocol
        - |
          objectName: n8n-db-password
          objectType: secret
          objectAlias: db-password
        - |
          objectName: n8n-db-app-user
          objectType: secret
          objectAlias: db-app-user
        - |
          objectName: n8n-db-app-password
          objectType: secret
          objectAlias: db-app-password
        - |
          objectName: n8n-redis-password
          objectType: secret
          objectAlias: redis-password
        - |
          objectName: n8n-license-key
          objectType: secret
          objectAlias: license-key
        # n8n-s3-* removed — S3 deprecated (Azure Blob external storage uses managed
        # identity, no KV secret). See .env "External data storage".
        - |
          objectName: n8n-runner-auth-token
          objectType: secret
          objectAlias: runner-auth-token
        # --- SMTP secret (UNCOMMENT when SMTP is configured in KV) ---
        # - |
        #   objectName: n8n-smtp-password
        #   objectType: secret
        #   objectAlias: smtp-password
  # Sync KeyVault secrets → Kubernetes secrets (so Helm chart can reference them)
  secretObjects:
    - secretName: n8n-core-secrets
      type: Opaque
      data:
        - objectName: encryption-key
          key: N8N_ENCRYPTION_KEY
        - objectName: host
          key: N8N_HOST
        - objectName: port
          key: N8N_PORT
        - objectName: protocol
          key: N8N_PROTOCOL
    - secretName: n8n-db-secret
      type: Opaque
      data:
        - objectName: db-password
          key: password
        - objectName: db-app-user
          key: app-user
        - objectName: db-app-password
          key: app-password
    - secretName: n8n-redis-secret
      type: Opaque
      data:
        - objectName: redis-password
          key: password
    - secretName: n8n-license-secret
      type: Opaque
      data:
        - objectName: license-key
          key: license-key
    - secretName: n8n-runner-token
      type: Opaque
      data:
        - objectName: runner-auth-token
          key: auth-token
    # --- SMTP secret (UNCOMMENT when SMTP is configured in KV) ---
    # - secretName: n8n-smtp-secret
    #   type: Opaque
    #   data:
    #     - objectName: smtp-password
    #       key: password
