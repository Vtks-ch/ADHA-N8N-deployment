    #   value: "587"
    # - name: N8N_SMTP_USER
    #   value: "<smtp-user>"             # e.g. n8n-noreply@example.com
    # - name: N8N_SMTP_SENDER
    #   value: "<smtp-sender>"           # e.g. n8n-noreply@example.com
    # - name: N8N_SMTP_SSL
    #   value: "true"
